name: CI

on:
  pull_request:
    branches: [development]
  push:
    branches: [development]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # Real values come from repo secrets when present; the placeholders
          # only satisfy build-time env validation (no network calls at build).
          NEXT_PUBLIC_SUPABASE_FOCUSPOND_BASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_FOCUSPOND_BASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_FOCUSPOND_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_FOCUSPOND_ANON_KEY || 'placeholder-anon-key' }}
