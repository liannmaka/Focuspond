name: CI

on:
  pull_request:
    branches: [development]
  push:
    branches: [development]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
        env:
          # A timezone that observes daylight saving, so the date code is
          # actually exercised across a 23- and a 25-hour day. The project is
          # developed in Africa/Lagos (UTC+1, no DST), where every day is
          # exactly 24 hours and a streak stepping by 86,400,000 ms looks
          # perfectly correct — so without this, the DST cases in
          # features/progress and features/tasks assert nothing anywhere.
          TZ: Europe/London

      - name: Build
        run: pnpm build
        env:
          # Real values come from repo secrets when present; the placeholders
          # only satisfy build-time env validation (no network calls at build).
          NEXT_PUBLIC_SUPABASE_FOCUSPOND_BASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_FOCUSPOND_BASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_FOCUSPOND_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_FOCUSPOND_ANON_KEY || 'placeholder-anon-key' }}
